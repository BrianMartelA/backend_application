$kind: http-example
request:
  url: "{{baseUrl}}/razas/:id"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "nombre_raza": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "{}"
order: 1000
